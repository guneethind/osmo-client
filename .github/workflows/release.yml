name: Windows release

# A tag like v1.6.6 builds the release and publishes it. "Run workflow" (any branch) builds and tests only:
# nothing is published, the files stay as a workflow artifact for 14 days.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Version must match the tag
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path camlink\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match camlink.__version__ ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y --version 6.4.3

      - name: Build
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Smoke test the program folder
        shell: pwsh
        run: .\packaging\smoke.ps1 -Folder dist\OsmoClient

      - name: Smoke test the portable zip, from a deep folder
        shell: pwsh
        run: |
          $deep = Join-Path $env:RUNNER_TEMP ('a' * 40 + '\' + 'b' * 40 + '\' + 'c' * 40)
          New-Item -ItemType Directory -Force $deep | Out-Null
          Expand-Archive (Get-ChildItem dist\*-portable.zip).FullName -DestinationPath $deep
          .\packaging\smoke.ps1 -Folder (Get-ChildItem $deep -Directory).FullName -Port 18092

      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait
          .\packaging\smoke.ps1 -Folder $target -Port 18093
          $uninstall = Join-Path $target 'unins000.exe'
          Start-Process $uninstall -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $target 'OsmoClient.exe')) { throw 'The uninstaller left the program behind' }

      - name: SBOM
        shell: pwsh
        run: |
          build\venv\Scripts\python.exe -m pip install --quiet cyclonedx-bom
          build\venv\Scripts\python.exe -m cyclonedx_py environment --of JSON -o dist\sbom.cdx.json build\venv\Scripts\python.exe
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Osmo Client $VERSION" --verify-tag --notes "$(cat <<EOF
          Windows 10/11 (64-bit). No Python needed.

          - **OsmoClient-$VERSION-setup.exe**: installer for the current user (no administrator rights).
          - **OsmoClient-$VERSION-windows-x64-portable.zip**: unzip anywhere short (for example \`C:\\OsmoClient\`) and run \`OsmoClient.exe\`; everything it writes stays in its \`data\` folder.
          - **SHA256SUMS.txt**, **sbom.cdx.json**: checksums and software bill of materials.

          These files are not code-signed yet, so Windows SmartScreen may warn on first start ("More info", then "Run anyway").
          Verify a download: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          )"
